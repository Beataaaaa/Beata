<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美女 隨手記</title>
  <style>
    :root {
      --bg-dark: #0c111f;
      --card-bg: #2d1f44;
      --card-inner: #512f5c;
      --accent-orange: #ed9e6f;
      --accent-rose: #b66570;
      --accent-purple: #80466e;
      --text-light: #f0eaf5;
      --text-muted: #b8a6c9;
      --border-color: rgba(237, 158, 111, 0.2);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: rgba(45, 31, 68, 0.8);
      backdrop-filter: blur(10px);
      color: var(--accent-orange);
      text-align: center;
      padding: 18px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent-orange);
      font-size: 1.1rem;
      cursor: pointer;
      display: none; /* 預設首頁隱藏 */
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    /* 首頁四大卡片網格 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .main-card {
      background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-inner) 100%);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 110px;
    }

    .main-card:active {
      transform: scale(0.96);
      border-color: var(--accent-orange);
    }

    .main-card-icon {
      width: 32px;
      height: 32px;
      stroke: var(--accent-orange);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 10px;
    }

    .main-card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-light);
    }

    /* 內頁卡片容器 */
    .detail-container {
      display: none; /* 點擊後顯示 */
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 18px;
      color: var(--accent-orange);
      font-size: 1.1rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* 行事曆樣式 (雜記專用) */
    .calendar-container {
      background: var(--card-inner);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: var(--accent-orange);
      margin-bottom: 12px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      font-size: 0.85rem;
    }

    .cal-day-head {
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 4px;
    }

    .cal-day {
      padding: 8px 0;
      border-radius: 10px;
      color: var(--text-light);
      cursor: pointer;
    }

    .cal-day.today {
      background-color: var(--accent-orange);
      color: var(--bg-dark);
      font-weight: 700;
    }

    .cal-day.selected {
      border: 1px solid var(--accent-orange);
    }

    /* 輸入表單樣式 */
    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      background-color: rgba(12, 17, 31, 0.6);
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 0.95rem;
      color: var(--text-light);
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(237, 158, 111, 0.15);
    }

    button.btn-primary {
      background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-rose) 100%);
      color: var(--bg-dark);
      border: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      transition: opacity 0.2s ease;
    }

    button.btn-primary:active {
      opacity: 0.85;
    }

    .loading-box {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <button id="back-btn" class="back-btn" onclick="showDashboard()">← 返回</button>
    <span id="page-title">美女 隨手記</span>
    <span style="width: 40px;"></span> <!-- 保持標題居中平衡 -->
  </header>

  <main>
    <!-- 首頁：四大入口卡片網格 -->
    <div id="dashboard" class="dashboard-grid">
      <div class="main-card" onclick="openDetail('美容紀錄')">
        <svg class="main-card-icon" viewBox="0 0 24 24">
          <path d="M12 3l1.5 3.5L17 8l-3.5 1.5L12 13l-1.5-3.5L7 8l3.5-1.5z"></path>
          <path d="M5 16l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"></path>
        </svg>
        <span class="main-card-title">美容紀錄</span>
      </div>

      <div class="main-card" onclick="openDetail('日常記帳')">
        <svg class="main-card-icon" viewBox="0 0 24 24">
          <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
          <path d="M16 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path>
        </svg>
        <span class="main-card-title">日常記帳</span>
      </div>

      <div class="main-card" onclick="openDetail('隨手雜記')">
        <svg class="main-card-icon" viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span class="main-card-title">隨手雜記</span>
      </div>

      <div class="main-card" onclick="openDetail('減肥紀錄')">
        <svg class="main-card-icon" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"></path>
        </svg>
        <span class="main-card-title">減肥紀錄</span>
      </div>
    </div>

    <!-- 內頁：新增表單頁面 -->
    <div id="detail-page" class="detail-container">
      
      <!-- 雜記專屬行事曆（非雜記頁面會自動隱藏） -->
      <div id="calendar-wrapper" class="calendar-container" style="display: none;">
        <div class="calendar-header">
          <span id="cal-month-year">2026 年 7 月</span>
          <span>📅 行事曆</span>
        </div>
        <div class="calendar-grid">
          <div class="cal-day-head">日</div>
          <div class="cal-day-head">一</div>
          <div class="cal-day-head">二</div>
          <div class="cal-day-head">三</div>
          <div class="cal-day-head">四</div>
          <div class="cal-day-head">五</div>
          <div class="cal-day-head">六</div>
          <!-- 簡易示範日期列 -->
          <div class="cal-day">26</div>
          <div class="cal-day today">27</div>
          <div class="cal-day">28</div>
          <div class="cal-day">29</div>
          <div class="cal-day">30</div>
          <div class="cal-day">31</div>
          <div class="cal-day">1</div>
        </div>
      </div>

      <div class="card">
        <h3 id="form-title">新增紀錄</h3>
        <div id="dynamic-form-fields" class="loading-box">正在讀取欄位...</div>
        <button id="submit-btn" class="btn-primary" style="display:none;" onclick="submitForm()">儲存紀錄</button>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzGm3GBHu5u_N7SokU9rjpRWMEMv81QD7M7SAo0FisLiwJ9gLWcv26MzSo_dNhPF0oR/exec";
    
    let currentSheet = "";

    // 顯示首頁卡片
    function showDashboard() {
      document.getElementById('dashboard').style.display = 'grid';
      document.getElementById('detail-page').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      document.getElementById('page-title').innerText = "美女 隨手記";
    }

    // 點擊卡片進入新增頁面
    function openDetail(sheetName) {
      currentSheet = sheetName;
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('detail-page').style.display = 'block';
      document.getElementById('back-btn').style.display = 'block';
      document.getElementById('page-title').innerText = sheetName;

      // 如果是「隨手雜記」，顯示行事曆
      if (sheetName === '隨手雜記') {
        document.getElementById('calendar-wrapper').style.display = 'block';
      } else {
        document.getElementById('calendar-wrapper').style.display = 'none';
      }

      loadSheetFields(sheetName);
    }

    function loadSheetFields(sheetName) {
      document.getElementById('dynamic-form-fields').innerHTML = '<div class="loading-box">正在讀取欄位...</div>';
      document.getElementById('submit-btn').style.display = 'none';

      const cacheBuster = new Date().getTime();
      const requestUrl = `${API_URL}?sheet=${encodeURIComponent(sheetName)}&t=${cacheBuster}`;

      fetch(requestUrl)
        .then(res => res.json())
        .then(data => {
          if (data && data.error) {
            document.getElementById('dynamic-form-fields').innerHTML = "連線失敗：" + data.error;
            return;
          }

          if (data && data.length > 0) {
            renderForm(data[0]);
          } else {
            document.getElementById('dynamic-form-fields').innerHTML = "未找到欄位設定";
          }
        })
        .catch(err => {
          document.getElementById('dynamic-form-fields').innerHTML = "連線失敗，請稍後再試。";
        });
    }

    function renderForm(headers) {
      document.getElementById('form-title').innerText = `新增${currentSheet}`;
      const container = document.getElementById('dynamic-form-fields');
      container.innerHTML = "";

      headers.forEach((headerName) => {
        if (!headerName) return;
        
        const group = document.createElement('div');
        group.className = 'input-group';
        
        const label = document.createElement('label');
        label.innerText = headerName;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `輸入${headerName}...`;
        input.className = 'field-input';

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      });

      document.getElementById('submit-btn').style.display = 'block';
    }

    function submitForm() {
      const inputs = document.querySelectorAll('.field-input');
      let rowData = [];
      inputs.forEach(input => rowData.push(input.value || ""));

      const btn = document.getElementById('submit-btn');
      btn.innerText = "儲存中...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sheetName: currentSheet, row: rowData })
      })
      .then(() => {
        alert("已成功發送紀錄");
        inputs.forEach(input => input.value = "");
        btn.innerText = "儲存紀錄";
        btn.disabled = false;
      })
      .catch(err => {
        alert("已成功發送紀錄");
        inputs.forEach(input => input.value = "");
        btn.innerText = "儲存紀錄";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
