<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的生活隨手記</title>
  <style>
    /* 全域質感風格設定 (莫蘭迪奶茶風) */
    :root {
      --bg-color: #f7f4f0;
      --card-bg: #ffffff;
      --primary-color: #9c8273;
      --text-color: #4a423d;
      --accent-color: #d1bfa7;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* 頂部標題欄 */
    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* 主內容顯示區域 */
    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 卡片與表單樣式 */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #e0d8d0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button.btn-primary:active {
      background-color: #826a5c;
    }

    /* 底部導覽列 (Tab Navigation) */
    nav {
      display: flex;
      background-color: var(--card-bg);
      border-top: 1px solid #e0d8d0;
      padding: 8px 0;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 0.85rem;
      color: #8c827a;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.4rem;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header id="page-title">💅 美容紀錄</header>

  <main>
    <!-- 分頁 1：美容紀錄 -->
    <section id="beauty" class="tab-content active">
      <div class="card">
        <h3>新增美甲 / 髮型紀錄</h3>
        <input type="text" placeholder="項目名稱 (如：貓眼奶茶美甲)">
        <select>
          <option>美甲</option>
          <option>頭髮</option>
          <option>美睫/其他</option>
        </select>
        <input type="text" placeholder="風格標籤 (如：#貓眼 #顯白)">
        <input type="number" placeholder="金額 ($)">
        <input type="file" accept="image/*">
        <button class="btn-primary">儲存紀錄</button>
      </div>
    </section>

    <!-- 分頁 2：日常記帳 -->
    <section id="accounting" class="tab-content">
      <div class="card">
        <h3>新增日常花費</h3>
        <input type="text" placeholder="消費項目 (如：午餐便當)">
        <input type="number" placeholder="金額 ($)">
        <select>
          <option>餐飲</option>
          <option>美容</option>
          <option>交通</option>
          <option>購物/娛樂</option>
        </select>
        <button class="btn-primary">記一筆</button>
      </div>
    </section>

    <!-- 分頁 3：隨手雜記 -->
    <section id="notes" class="tab-content">
      <div class="card">
        <h3>隨手記備忘</h3>
        <input type="text" placeholder="標題">
        <textarea rows="4" placeholder="寫下任何想上記的事..."></textarea>
        <button class="btn-primary">儲存筆記</button>
      </div>
    </section>

    <!-- 分頁 4：減肥紀錄 -->
    <section id="fitness" class="tab-content">
      <div class="card">
        <h3>今日身體數據</h3>
        <input type="number" step="0.1" placeholder="體重 (kg)">
        <input type="number" step="0.1" placeholder="體脂 (%)">
        <textarea rows="2" placeholder="今日飲食 / 運動狀況"></textarea>
        <button class="btn-primary">紀錄今日數據</button>
      </div>
    </section>
  </main>

  <!-- 底部導覽選單 -->
  <nav>
    <div class="nav-item active" onclick="switchTab('beauty', '💅 美容紀錄', this)">
      <span class="nav-icon">💅</span>美容
    </div>
    <div class="nav-item" onclick="switchTab('accounting', '💰 日常記帳', this)">
      <span class="nav-icon">💰</span>記帳
    </div>
    <div class="nav-item" onclick="switchTab('notes', '📝 隨手雜記', this)">
      <span class="nav-icon">📝</span>雜記
    </div>
    <div class="nav-item" onclick="switchTab('fitness', '⚖️ 減肥紀錄', this)">
      <span class="nav-icon">⚖️</span>減肥
    </div>
  </nav>

  <script>
    // 切換分頁邏輯
    function switchTab(tabId, title, element) {
      // 隱藏所有分頁
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      // 取消所有導覽點亮
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });

      // 顯示目標分頁與點亮按鈕
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
      document.getElementById('page-title').innerText = title;
    }
  </script>
</body>
</html>
