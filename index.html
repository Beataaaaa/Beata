<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的隨手記 App (v2.0)</title>
  <style>
    :root {
      --bg-color: #f7f4f0;
      --card-bg: #ffffff;
      --primary-color: #9c8273;
      --text-color: #4a423d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0d8d0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    nav {
      display: flex;
      background-color: var(--card-bg);
      border-top: 1px solid #e0d8d0;
      padding: 8px 0;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 0.85rem;
      color: #8c827a;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.4rem;
      display: block;
    }

    .debug-status {
      font-size: 0.8rem;
      color: #999;
      margin-top: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header id="page-title">💅 美容紀錄</header>

  <main>
    <div class="card">
      <h3 id="form-title">資料連線中...</h3>
      <div id="dynamic-form-fields">正在讀取試算表...</div>
      <button id="submit-btn" class="btn-primary" style="display:none;" onclick="submitForm()">儲存紀錄到試算表</button>
      <div id="debug-info" class="debug-status"></div>
    </div>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab('美容紀錄', '💅 美容紀錄', this)">
      <span class="nav-icon">💅</span>美容
    </div>
    <div class="nav-item" onclick="switchTab('日常記帳', '💰 日常記帳', this)">
      <span class="nav-icon">💰</span>記帳
    </div>
    <div class="nav-item" onclick="switchTab('隨手雜記', '📝 隨手雜記', this)">
      <span class="nav-icon">📝</span>雜記
    </div>
    <div class="nav-item" onclick="switchTab('減肥紀錄', '⚖️ 減肥紀錄', this)">
      <span class="nav-icon">⚖️</span>減肥
    </div>
  </nav>

  <script>
    // 已更新為你的新網址
    const API_URL = "https://script.google.com/macros/s/AKfycbzGm3GBHu5u_N7SokU9rjpRWMEMv81QD7M7SAo0FisLiwJ9gLWcv26MzSo_dNhPF0oR/exec";
    
    let currentSheet = "美容紀錄";

    window.onload = function() {
      loadSheetFields(currentSheet);
    };

    function switchTab(sheetName, title, element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('page-title').innerText = title;
      
      currentSheet = sheetName;
      loadSheetFields(sheetName);
    }

    function loadSheetFields(sheetName) {
      document.getElementById('dynamic-form-fields').innerHTML = "正在拉取最新欄位...";
      document.getElementById('submit-btn').style.display = 'none';
      document.getElementById('debug-info').innerText = "";

      // 加上隨機時間戳記 (t=...) 避免瀏覽器讀取快取舊資料
      const cacheBuster = new Date().getTime();
      const requestUrl = `${API_URL}?sheet=${encodeURIComponent(sheetName)}&t=${cacheBuster}`;

      fetch(requestUrl)
        .then(res => res.json())
        .then(data => {
          if (data && data.error) {
            document.getElementById('dynamic-form-fields').innerHTML = "Google 試算表錯誤：" + data.error;
            return;
          }

          if (data && data.length > 0) {
            renderForm(data[0]);
            document.getElementById('debug-info').innerText = `目前讀取工作表：${sheetName}（共 ${data.length} 列資料）`;
          } else {
            document.getElementById('dynamic-form-fields').innerHTML = "工作表為空或未建標題。";
          }
        })
        .catch(err => {
          document.getElementById('dynamic-form-fields').innerHTML = "連線失敗，請稍後再試。";
          document.getElementById('debug-info').innerText = "錯誤資訊：" + err;
        });
    }

    function renderForm(headers) {
      document.getElementById('form-title').innerText = `填寫 [${currentSheet}]`;
      const container = document.getElementById('dynamic-form-fields');
      container.innerHTML = "";

      headers.forEach((headerName, index) => {
        if (!headerName) return; // 忽略空白標題
        
        const group = document.createElement('div');
        group.className = 'input-group';
        
        const label = document.createElement('label');
        label.innerText = headerName;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `請輸入${headerName}...`;
        input.className = 'field-input';

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      });

      document.getElementById('submit-btn').style.display = 'block';
    }

    function submitForm() {
      const inputs = document.querySelectorAll('.field-input');
      let rowData = [];
      inputs.forEach(input => rowData.push(input.value || ""));

      const btn = document.getElementById('submit-btn');
      btn.innerText = "儲存中...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sheetName: currentSheet, row: rowData })
      })
      .then(() => {
        alert(`已成功發送資料至 [${currentSheet}]！`);
        inputs.forEach(input => input.value = "");
        btn.innerText = "儲存紀錄到試算表";
        btn.disabled = false;
      })
      .catch(err => {
        alert("已發送！");
        inputs.forEach(input => input.value = "");
        btn.innerText = "儲存紀錄到試算表";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
