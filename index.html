<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的隨手記 App</title>
  <style>
    :root {
      --bg-color: #f7f4f0;
      --card-bg: #ffffff;
      --primary-color: #9c8273;
      --text-color: #4a423d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.95rem;
      color: var(--text-color);
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0d8d0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button.btn-primary:active {
      background-color: #826a5c;
    }

    .loading {
      text-align: center;
      color: #8c827a;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header id="page-title">📝 我的隨手記</header>

  <main>
    <div class="card">
      <h3 id="form-title">讀取試算表欄位中...</h3>
      <!-- 動態輸入框生成區域 -->
      <div id="dynamic-form-fields" class="loading">正在從你的 Google 試算表抓取品項...</div>
      
      <button class="btn-primary" onclick="submitForm()">儲存紀錄到試算表</button>
    </div>
  </main>

  <script>
    // ⚠️ 請填入你的 Google Apps Script 部署網址
    const API_URL = "https://script.google.com/macros/s/你的網址/exec";

    let headersList = [];

    // 頁面打開時，自動抓取試算表第 1 列當作輸入欄位
    window.onload = function() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            headersList = data[0]; // 第一列標題
            renderForm(headersList);
          } else {
            document.getElementById('dynamic-form-fields').innerHTML = "試算表中沒有找到標題欄位。";
          }
        })
        .catch(err => {
          console.error("無法連線至試算表:", err);
          document.getElementById('dynamic-form-fields').innerHTML = "載入失敗，請確認 Apps Script 網址設定正確。";
        });
    };

    // 動態渲染表單畫面
    function renderForm(headers) {
      document.getElementById('form-title').innerText = "填寫紀錄";
      const container = document.getElementById('dynamic-form-fields');
      container.innerHTML = "";

      headers.forEach((headerName, index) => {
        // 自動生成標籤與輸入框
        const group = document.createElement('div');
        group.className = 'input-group';
        
        const label = document.createElement('label');
        label.innerText = headerName;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `請輸入${headerName}...`;
        input.dataset.index = index;
        input.className = 'field-input';

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      });
    }

    // 送出表單資料寫回試算表
    function submitForm() {
      const inputs = document.querySelectorAll('.field-input');
      let rowData = [];

      inputs.forEach(input => {
        rowData.push(input.value || "");
      });

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ row: rowData })
      })
      .then(() => {
        alert("已成功寫入 Google 試算表！");
        inputs.forEach(input => input.value = ""); // 清空欄位
      })
      .catch(() => {
        alert("已發送紀錄！");
        inputs.forEach(input => input.value = "");
      });
    }
  </script>
</body>
</html>
