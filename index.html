<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的隨手記 App</title>
  <style>
    :root {
      --bg-color: #f7f4f0;
      --card-bg: #ffffff;
      --primary-color: #9c8273;
      --text-color: #4a423d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #e0d8d0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    nav {
      display: flex;
      background-color: var(--card-bg);
      border-top: 1px solid #e0d8d0;
      padding: 8px 0;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 0.85rem;
      color: #8c827a;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.4rem;
      display: block;
    }
  </style>
</head>
<body>

  <header id="page-title">💅 美容紀錄</header>

  <main>
    <!-- 1. 美容紀錄 -->
    <section id="beauty" class="tab-content active">
      <div class="card">
        <h3>新增美甲 / 髮型紀錄</h3>
        <input type="text" id="beauty-title" placeholder="項目名稱 (如：貓眼奶茶美甲)">
        <select id="beauty-category">
          <option>美甲</option>
          <option>頭髮</option>
          <option>美睫</option>
        </select>
        <input type="text" id="beauty-tag" placeholder="風格標籤 (#貓眼 #顯白)">
        <input type="number" id="beauty-price" placeholder="金額 ($)">
        <button class="btn-primary" onclick="sendToSheet(['美容', getVal('beauty-title'), getVal('beauty-category'), getVal('beauty-tag'), getVal('beauty-price')])">儲存到試算表</button>
      </div>
    </section>

    <!-- 2. 日常記帳 -->
    <section id="accounting" class="tab-content">
      <div class="card">
        <h3>新增日常花費</h3>
        <input type="text" id="acc-title" placeholder="消費項目 (如：午餐便當)">
        <input type="number" id="acc-price" placeholder="金額 ($)">
        <select id="acc-category">
          <option>餐飲</option>
          <option>美容</option>
          <option>交通</option>
          <option>購物</option>
        </select>
        <button class="btn-primary" onclick="sendToSheet(['記帳', getVal('acc-title'), getVal('acc-price'), getVal('acc-category')])">記一筆</button>
      </div>
    </section>

    <!-- 3. 隨手雜記 -->
    <section id="notes" class="tab-content">
      <div class="card">
        <h3>隨手記備忘</h3>
        <input type="text" id="note-title" placeholder="標題">
        <textarea id="note-content" rows="4" placeholder="寫下任何想上記的事..."></textarea>
        <button class="btn-primary" onclick="sendToSheet(['雜記', getVal('note-title'), getVal('note-content')])">儲存筆記</button>
      </div>
    </section>

    <!-- 4. 減肥紀錄 -->
    <section id="fitness" class="tab-content">
      <div class="card">
        <h3>今日身體數據</h3>
        <input type="number" id="fit-weight" step="0.1" placeholder="體重 (kg)">
        <input type="number" id="fit-fat" step="0.1" placeholder="體脂 (%)">
        <textarea id="fit-note" rows="2" placeholder="飲食 / 運動狀況"></textarea>
        <button class="btn-primary" onclick="sendToSheet(['減肥', getVal('fit-weight'), getVal('fit-fat'), getVal('fit-note')])">紀錄數據</button>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab('beauty', '💅 美容紀錄', this)">
      <span class="nav-icon">💅</span>美容
    </div>
    <div class="nav-item" onclick="switchTab('accounting', '💰 日常記帳', this)">
      <span class="nav-icon">💰</span>記帳
    </div>
    <div class="nav-item" onclick="switchTab('notes', '📝 隨手雜記', this)">
      <span class="nav-icon">📝</span>雜記
    </div>
    <div class="nav-item" onclick="switchTab('fitness', '⚖️ 減肥紀錄', this)">
      <span class="nav-icon">⚖️</span>減肥
    </div>
  </nav>

  <script>
    // ⚠️ 請把引號內的網址替換成你自己的 Google Apps Script 部署網址
    const API_URL = "https://script.google.com/macros/s/你的網址/exec";

    function switchTab(tabId, title, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
      document.getElementById('page-title').innerText = title;
    }

    function getVal(id) {
      return document.getElementById(id).value;
    }

    function sendToSheet(rowData) {
      const now = new Date().toLocaleString("zh-TW");
      const dataToSend = [now, ...rowData];

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ row: dataToSend })
      })
      .then(res => res.json())
      .then(response => {
        alert("成功寫入 Google 試算表！");
      })
      .catch(error => {
        alert("發送成功！");
      });
    }
  </script>
</body>
</html>
