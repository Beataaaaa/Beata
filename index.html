<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的隨手記 App</title>
  <style>
    :root {
      --bg-color: #f7f4f0;
      --card-bg: #ffffff;
      --primary-color: #9c8273;
      --text-color: #4a423d;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0d8d0;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    /* 底部導覽列 */
    nav {
      display: flex;
      background-color: var(--card-bg);
      border-top: 1px solid #e0d8d0;
      padding: 8px 0;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 0.85rem;
      color: #8c827a;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.4rem;
      display: block;
    }
  </style>
</head>
<body>

  <header id="page-title">💅 美容紀錄</header>

  <main>
    <div class="card">
      <h3 id="form-title">讀取中...</h3>
      <div id="dynamic-form-fields">正在讀取試算表欄位...</div>
      <button id="submit-btn" class="btn-primary" style="display:none;" onclick="submitForm()">儲存紀錄到試算表</button>
    </div>
  </main>

  <!-- 底部選單回歸 -->
  <nav>
    <div class="nav-item active" onclick="switchTab('美容紀錄', '💅 美容紀錄', this)">
      <span class="nav-icon">💅</span>美容
    </div>
    <div class="nav-item" onclick="switchTab('日常記帳', '💰 日常記帳', this)">
      <span class="nav-icon">💰</span>記帳
    </div>
    <div class="nav-item" onclick="switchTab('隨手雜記', '📝 隨手雜記', this)">
      <span class="nav-icon">📝</span>雜記
    </div>
    <div class="nav-item" onclick="switchTab('減肥紀錄', '⚖️ 減肥紀錄', this)">
      <span class="nav-icon">⚖️</span>減肥
    </div>
  </nav>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby5vGHlcLtWfpg8XbDt9v-9sM-m2daEO2habIwe63rTsFIZjAHgd5SzDJ-wem2bB1li/exec";
    
    let currentSheet = "美容紀錄"; // 預設第一個分頁

    window.onload = function() {
      loadSheetFields(currentSheet);
    };

    // 切換分頁邏輯
    function switchTab(sheetName, title, element) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('page-title').innerText = title;
      
      currentSheet = sheetName;
      loadSheetFields(sheetName);
    }

    // 抓取指定工作表的標題欄位
    function loadSheetFields(sheetName) {
      document.getElementById('dynamic-form-fields').innerHTML = "載入欄位中...";
      document.getElementById('submit-btn').style.display = 'none';

      fetch(`${API_URL}?sheet=${encodeURIComponent(sheetName)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            renderForm(data[0]); // 抓第一列標題
          } else {
            document.getElementById('dynamic-form-fields').innerHTML = "此工作表無資料或未建立標題。";
          }
        })
        .catch(err => {
          document.getElementById('dynamic-form-fields').innerHTML = "載入失敗，請確認試算表分頁名稱是否符合。";
        });
    }

    function renderForm(headers) {
      document.getElementById('form-title').innerText = `填寫 [${currentSheet}]`;
      const container = document.getElementById('dynamic-form-fields');
      container.innerHTML = "";

      headers.forEach((headerName, index) => {
        const group = document.createElement('div');
        group.className = 'input-group';
        
        const label = document.createElement('label');
        label.innerText = headerName;
        
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = `請輸入${headerName}...`;
        input.className = 'field-input';

        group.appendChild(label);
        group.appendChild(input);
        container.appendChild(group);
      });

      document.getElementById('submit-btn').style.display = 'block';
    }

    function submitForm() {
      const inputs = document.querySelectorAll('.field-input');
      let rowData = [];
      inputs.forEach(input => rowData.push(input.value || ""));

      const btn = document.getElementById('submit-btn');
      btn.innerText = "儲存中...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sheetName: currentSheet, row: rowData })
      })
      .then(() => {
        alert(`已成功寫入 ${currentSheet}！`);
        inputs.forEach(input => input.value = "");
        btn.innerText = "儲存紀錄到試算表";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
