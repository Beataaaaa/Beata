<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美女 隨手記</title>
  <style>
    :root {
      --bg-dark: #0f1317;
      --card-glass: rgba(26, 32, 40, 0.55);
      --card-border: rgba(255, 255, 255, 0.25);
      --accent-gold: #f3a87c;
      --accent-green: #a2d2bf;
      --text-white: #ffffff;
      --text-dim: #b0b8c1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-white);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(rgba(15, 19, 23, 0.55), rgba(8, 10, 14, 0.88)), url('5.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* 頂部 Header 區域 */
    header {
      padding: 20px 24px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-white);
      cursor: pointer;
    }

    .brand-logo span {
      color: var(--accent-gold);
      font-size: 1.3rem;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s;
    }

    .avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    /* 主區域 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding-bottom: 70px;
    }

    /* 3D 堆疊卡片輪播 Container (首頁與內頁共用樣式) */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 490px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    /* 卡片共通樣式 */
    .wander-card {
      position: absolute;
      width: 310px;
      height: 460px;
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* 首頁卡片的底圖 */
    .wander-card-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      transition: transform 0.5s ease;
    }

    .wander-card:hover .wander-card-bg {
      transform: scale(1.05);
    }

    .wander-card-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(15, 19, 23, 0.7) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
      box-sizing: border-box;
    }

    .wander-card-text-box {
      background: rgba(20, 26, 32, 0.55);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .wander-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .wander-card-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text-white);
      margin-bottom: 4px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .wander-card-subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    /* 卡片 3D 位置與透視狀態 */
    .wander-card[data-pos="0"] {
      transform: translate3d(0, 0, 0) scale(1);
      z-index: 5;
      opacity: 1;
      filter: brightness(1);
    }

    .wander-card[data-pos="-1"] {
      transform: translate3d(-200px, 0, -100px) scale(0.82) rotateY(12deg);
      z-index: 3;
      opacity: 0.6;
      filter: brightness(0.75);
    }

    .wander-card[data-pos="1"] {
      transform: translate3d(200px, 0, -100px) scale(0.82) rotateY(-12deg);
      z-index: 3;
      opacity: 0.6;
      filter: brightness(0.75);
    }

    .wander-card[data-pos="2"], .wander-card[data-pos="-2"] {
      transform: translate3d(0, 0, -200px) scale(0.7);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    /* 兩側切換箭頭按鈕 */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      color: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      z-index: 15;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .nav-arrow:active {
      transform: translateY(-50%) scale(0.9);
      background: #ffffff;
    }

    .nav-arrow.left { left: 16px; }
    .nav-arrow.right { right: 16px; }

    /* 底部控制器列 */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }

    .copyright-text {
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.3;
    }

    .dots-indicator {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s;
    }

    .dot.active {
      width: 18px;
      border-radius: 10px;
      background: var(--accent-gold);
    }

    .swipe-pill {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
    }

    /* 內頁卡片內部的樣式 */
    .inner-card-title {
      color: var(--accent-gold);
      font-size: 1.1rem;
      font-weight: 800;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .inner-card-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* 自訂捲軸樣式 */
    .inner-card-body::-webkit-scrollbar {
      width: 4px;
    }
    .inner-card-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--card-border);
      background-color: rgba(18, 22, 25, 0.75);
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 0.9rem;
      color: var(--text-white);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    button.btn-primary {
      background: var(--text-white);
      color: var(--bg-dark);
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    .history-row-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }

    .history-item-label {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .history-item-val {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-white);
    }

    .loading-box {
      text-align: center;
      padding: 30px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header>
    <div class="brand-logo" onclick="showDashboard()">
      <span>✦</span> TUNG WONDERLAND
    </div>
    <button id="back-btn" class="back-btn" onclick="showDashboard()">← Go Back</button>
    <img src="1.jpg" class="avatar-img" alt="Avatar">
  </header>

  <main>
    <!-- 主畫面 (主 3D 輪播) -->
    <div id="dashboard" style="display: block; width: 100%;">
      <div class="carousel-container">
        
        <div class="nav-arrow left" onclick="prevMainCard()">‹</div>

        <!-- 卡片 1: BEAUTY -->
        <div class="wander-card" data-index="0" data-pos="0" onclick="cardClick(0, '美容紀錄')">
          <img src="1.jpg" class="wander-card-bg" alt="BEAUTY">
          <div class="wander-card-overlay">
            <div class="wander-card-header"><span>✦</span> TUNG WONDERLAND</div>
            <div class="wander-card-text-box">
              <div class="wander-card-title">BEAUTY</div>
              <div class="wander-card-subtitle">記錄今日的美麗 🌸✨</div>
            </div>
          </div>
        </div>

        <!-- 卡片 2: BOOKKEEPING -->
        <div class="wander-card" data-index="1" data-pos="1" onclick="cardClick(1, '日常記帳')">
          <img src="2.jpg" class="wander-card-bg" alt="FINANCE">
          <div class="wander-card-overlay">
            <div class="wander-card-header"><span>✦</span> TUNG WONDERLAND</div>
            <div class="wander-card-text-box">
              <div class="wander-card-title">BOOKKEEPING</div>
              <div class="wander-card-subtitle">看看你的錢都去哪啦 😜💸</div>
            </div>
          </div>
        </div>

        <!-- 卡片 3: DAILY -->
        <div class="wander-card" data-index="2" data-pos="2" onclick="cardClick(2, '隨手雜記')">
          <img src="3.jpg" class="wander-card-bg" alt="JOURNAL">
          <div class="wander-card-overlay">
            <div class="wander-card-header"><span>✦</span> TUNG WONDERLAND</div>
            <div class="wander-card-text-box">
              <div class="wander-card-title">DAILY</div>
              <div class="wander-card-subtitle">這日子到底是誰在過 😮‍💨😮‍💨</div>
            </div>
          </div>
        </div>

        <!-- 卡片 4: HEALTH -->
        <div class="wander-card" data-index="3" data-pos="-1" onclick="cardClick(3, '減肥紀錄')">
          <img src="4.jpg" class="wander-card-bg" alt="HEALTH">
          <div class="wander-card-overlay">
            <div class="wander-card-header"><span>✦</span> TUNG WONDERLAND</div>
            <div class="wander-card-text-box">
              <div class="wander-card-title">HEALTH</div>
              <div class="wander-card-subtitle">準備變身大美女 💪✨</div>
            </div>
          </div>
        </div>

        <div class="nav-arrow right" onclick="nextMainCard()">›</div>

      </div>
    </div>

    <!-- 內頁 (內頁 3D 卡片輪播) -->
    <div id="detail-page" style="display: none; width: 100%;">
      <div class="carousel-container">
        
        <div class="nav-arrow left" onclick="prevDetailCard()">‹</div>

        <!-- 動態生成的 3D 卡片容器 (第一個卡片為新增表單，後續為歷史紀錄) -->
        <div id="detail-cards-wrapper" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative;">
          <!-- JS 動態插入內頁卡片 -->
        </div>

        <div class="nav-arrow right" onclick="nextDetailCard()">›</div>

      </div>
    </div>
  </main>

  <!-- 底部控制器列 -->
  <div class="bottom-bar" id="bottom-bar">
    <div class="copyright-text">
      © TUNG WONDERLAND<br>All Rights Reserved
    </div>
    <div class="dots-indicator" id="dots-container">
      <!-- 動態呈現指示點 -->
    </div>
    <div class="swipe-pill" id="swipe-btn" onclick="handleSwipeBtn()">
      Swipe <span>»</span>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzGm3GBHu5u_N7SokU9rjpRWMEMv81QD7M7SAo0FisLiwJ9gLWcv26MzSo_dNhPF0oR/exec";
    
    // 主畫面狀態
    let currentSheet = "";
    let mainIndex = 0;
    const totalMainCards = 4;

    // 內頁狀態
    let isDetailPage = false;
    let detailIndex = 0;
    let totalDetailCards = 1;

    /* ================= 主畫面輪播邏輯 ================= */
    function updateMainCarousel() {
      const cards = document.querySelectorAll('#dashboard .wander-card');
      cards.forEach((card, i) => {
        let pos = i - mainIndex;
        if (pos < -1) pos += totalMainCards;
        if (pos > 2) pos -= totalMainCards;
        if (pos === 3) pos = -1;
        card.setAttribute('data-pos', pos);
      });
      renderDots(totalMainCards, mainIndex);
    }

    function nextMainCard() {
      mainIndex = (mainIndex + 1) % totalMainCards;
      updateMainCarousel();
    }

    function prevMainCard() {
      mainIndex = (mainIndex - 1 + totalMainCards) % totalMainCards;
      updateMainCarousel();
    }

    function cardClick(index, sheetName) {
      if (mainIndex === index) {
        openDetail(sheetName);
      } else {
        mainIndex = index;
        updateMainCarousel();
      }
    }

    /* ================= 內頁輪播邏輯 ================= */
    function updateDetailCarousel() {
      const cards = document.querySelectorAll('#detail-cards-wrapper .wander-card');
      cards.forEach((card, i) => {
        let pos = i - detailIndex;
        card.setAttribute('data-pos', pos);
      });
      renderDots(totalDetailCards, detailIndex);
    }

    function nextDetailCard() {
      if (totalDetailCards <= 1) return;
      detailIndex = (detailIndex + 1) % totalDetailCards;
      updateDetailCarousel();
    }

    function prevDetailCard() {
      if (totalDetailCards <= 1) return;
      detailIndex = (detailIndex - 1 + totalDetailCards) % totalDetailCards;
      updateDetailCarousel();
    }

    /* ================= 頁面切換與 API 讀取 ================= */
    function showDashboard() {
      isDetailPage = false;
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('detail-page').style.display = 'none';
      document.getElementById('back-btn').style.display = 'none';
      updateMainCarousel();
    }

    function openDetail(sheetName) {
      currentSheet = sheetName;
      isDetailPage = true;
      detailIndex = 0; // 重置預設看第一個卡片（新增紀錄）

      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('detail-page').style.display = 'block';
      document.getElementById('back-btn').style.display = 'block';

      loadSheetData(sheetName);
    }

    function loadSheetData(sheetName) {
      const container = document.getElementById('detail-cards-wrapper');
      container.innerHTML = '<div class="loading-box">正在讀取資料...</div>';

      const cacheBuster = new Date().getTime();
      const requestUrl = `${API_URL}?sheet=${encodeURIComponent(sheetName)}&t=${cacheBuster}`;

      fetch(requestUrl)
        .then(res => res.json())
        .then(data => {
          if (data && data.error) {
            container.innerHTML = `<div class="loading-box">讀取失敗：${data.error}</div>`;
            return;
          }

          if (data && data.length > 0) {
            buildDetailCards(data[0], data.slice(1));
          } else {
            container.innerHTML = `<div class="loading-box">未取得試算表欄位設定</div>`;
          }
        })
        .catch(err => {
          container.innerHTML = `<div class="loading-box">連線失敗，請稍後再試。</div>`;
        });
    }

    // 建立內頁的卡片 (Card 0: 新增表單, Card 1~N: 歷史紀錄)
    function buildDetailCards(headers, rows) {
      const container = document.getElementById('detail-cards-wrapper');
      container.innerHTML = "";

      const historyRows = [...rows].reverse(); // 歷史紀錄倒序（最新最前）
      totalDetailCards = 1 + historyRows.length; // 1張表單 + N張歷史紀錄

      // --- 1. 建立第一個卡片：新增紀錄表單卡片 ---
      const formCard = document.createElement('div');
      formCard.className = 'wander-card';
      
      let formCardHtml = `
        <div class="inner-card-title">✍️ 新增${currentSheet}</div>
        <div class="inner-card-body">
      `;

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      headers.forEach((headerName) => {
        if (!headerName) return;
        const lowerName = headerName.toLowerCase();

        if (lowerName.includes('照片') || lowerName.includes('圖片') || lowerName.includes('相片') || lowerName.includes('photo') || lowerName.includes('image')) {
          formCardHtml += `
            <div class="input-group">
              <label>${headerName}</label>
              <input type="file" accept="image/*" onchange="handleImageUpload(event, this)">
              <input type="hidden" class="field-input">
              <img class="img-preview" style="max-width:100%; max-height:120px; margin-top:8px; border-radius:8px; display:none;">
            </div>
          `;
        } else if (lowerName.includes('日期') || lowerName.includes('date')) {
          formCardHtml += `
            <div class="input-group">
              <label>${headerName}</label>
              <input type="date" class="field-input" value="${todayStr}">
            </div>
          `;
        } else {
          formCardHtml += `
            <div class="input-group">
              <label>${headerName}</label>
              <input type="text" class="field-input" placeholder="輸入${headerName}...">
            </div>
          `;
        }
      });

      formCardHtml += `
        </div>
        <button id="submit-btn" class="btn-primary" onclick="submitForm()">儲存紀錄</button>
      `;

      formCard.innerHTML = formCardHtml;
      container.appendChild(formCard);

      // --- 2. 建立後續卡片：歷史紀錄卡片 ---
      historyRows.forEach((row, rIdx) => {
        const histCard = document.createElement('div');
        histCard.className = 'wander-card';

        let histHtml = `
          <div class="inner-card-title">📜 紀錄 #${historyRows.length - rIdx}</div>
          <div class="inner-card-body">
        `;

        headers.forEach((headerName, hIdx) => {
          if (!headerName) return;
          const val = row[hIdx] || '—';

          if (val && (val.startsWith('data:image/') || (val.startsWith('http') && (val.endsWith('.png') || val.endsWith('.jpg') || val.endsWith('.jpeg'))))) {
            histHtml += `
              <div style="margin-bottom: 10px;">
                <span class="history-item-label">${headerName}</span>
                <img src="${val}" style="max-width:100%; max-height:160px; border-radius:12px; margin-top:6px; border:1px solid var(--card-border);">
              </div>
            `;
          } else {
            histHtml += `
              <div class="history-row-item">
                <span class="history-item-label">${headerName}</span>
                <span class="history-item-val">${val}</span>
              </div>
            `;
          }
        });

        histHtml += `</div>
          <div style="text-align:center; font-size:0.75rem; color:var(--text-dim);">← 左滑新增 / 右滑更多歷史</div>
        `;

        histCard.innerHTML = histHtml;
        container.appendChild(histCard);
      });

      updateDetailCarousel();
    }

    // 處理圖片轉 Base64 預覽
    function handleImageUpload(event, fileEl) {
      const file = event.target.files[0];
      const hiddenInput = fileEl.parentNode.querySelector('.field-input');
      const previewImg = fileEl.parentNode.querySelector('.img-preview');

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          hiddenInput.value = e.target.result;
          previewImg.src = e.target.result;
          previewImg.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        hiddenInput.value = '';
        previewImg.style.display = 'none';
      }
    }

    // 表單發送
    function submitForm() {
      const inputs = document.querySelectorAll('#detail-cards-wrapper .field-input');
      let rowData = [];
      inputs.forEach(input => rowData.push(input.value || ""));

      const btn = document.getElementById('submit-btn');
      btn.innerText = "儲存中...";
      btn.disabled = true;

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sheetName: currentSheet, row: rowData })
      })
      .then(() => {
        alert("已成功發送紀錄！");
        loadSheetData(currentSheet);
      })
      .catch(err => {
        alert("已成功發送紀錄！");
        loadSheetData(currentSheet);
      });
    }

    /* ================= 底部 Indicator 與控制 ================= */
    function renderDots(total, current) {
      const container = document.getElementById('dots-container');
      container.innerHTML = "";
      
      // 指示點最多顯示 6 個避免過多
      const showCount = Math.min(total, 6);
      for (let i = 0; i < showCount; i++) {
        const dot = document.createElement('div');
        dot.className = (i === current) ? 'dot active' : 'dot';
        container.appendChild(dot);
      }
    }

    function handleSwipeBtn() {
      if (isDetailPage) {
        nextDetailCard();
      } else {
        nextMainCard();
      }
    }

    // 初始化主畫面
    updateMainCarousel();
  </script>
</body>
</html>
